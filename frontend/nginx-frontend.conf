server {
    listen 80;
    root /user/share/nginx/html;
    index index.html;

    # All routes fall back to index.html (React client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
