# /etc/nginx/sites-available/datapulse
# On EC2: sudo ln -s this file to /etc/nginx/sites-enabled/datapulse
#
# This sits in front of Docker on the EC2 host.
# - Port 80  → React frontend (Docker container on :80)
# - /api/*   → FastAPI backend (Docker container on :8000)
#
# Access restriction: HTTP Basic Auth — only people with the
# password (shared in your resume) can open the site.
# Generate the .htpasswd file with:
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd datapulse
#   (then enter the password you'll share in your resume)

server {
    listen 80;
    server_name _;          # catches any hostname / raw IP

    # ── HTTP Basic Auth ────────────────────────────────────────────────
    auth_basic           "DataPulse — Portfolio Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── API proxy (SSE-safe) ───────────────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;

        # Critical for SSE: disable buffering so events arrive immediately
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        '';
    }

    # ── Frontend ───────────────────────────────────────────────────────
    location / {
        proxy_pass         http://localhost:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # ── Security headers ───────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy        "strict-origin-when-cross-origin";
}
